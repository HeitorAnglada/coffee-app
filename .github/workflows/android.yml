name: Android CI

on:
  push:
    branches: [ "**" ]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Testes e APK de debug
        run: ./gradlew --no-daemon testDebugUnitTest --tests '*DomainTest*' --tests '*UiTest*' assembleDebug

      # Imagens das telas geradas no computador (Robolectric), para conferir o visual sem um celular.
      - name: Imagens das telas
        id: screens
        continue-on-error: true
        run: ./gradlew --no-daemon testDebugUnitTest --tests '*ScreenshotTest*'

      - name: Publicar imagens das telas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: telas
          path: app/build/outputs/roborazzi/*.png
          if-no-files-found: ignore

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: coffee-app-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      # A cada push no master, publica uma versão em Releases com o arquivo Bloombrew.apk.
      # O link do README (releases/latest/download/Bloombrew.apk) sempre aponta para a mais nova.
      - name: Publicar versão para download
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Bloombrew.apk
          gh release create "build-${{ github.run_number }}" Bloombrew.apk \
            --target "${{ github.sha }}" \
            --title "Bloombrew · versão ${{ github.run_number }}" \
            --notes "Baixe o arquivo Bloombrew.apk abaixo e abra no celular Android (8.0 ou mais novo)." \
            --latest

      # Em outros branches, publica uma "prévia" (pré-lançamento) com o APK e as imagens das telas,
      # para testar antes de juntar no master. O link "latest" do README continua no master.
      - name: Publicar prévia
        if: github.event_name == 'push' && github.ref != 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Bloombrew-previa.apk
          gh release delete previa --yes --cleanup-tag || true
          files="Bloombrew-previa.apk"
          ls app/build/outputs/roborazzi/*.png >/dev/null 2>&1 && files="$files app/build/outputs/roborazzi/*.png"
          gh release create previa $files \
            --target "${{ github.sha }}" \
            --prerelease \
            --title "Bloombrew · prévia (${{ github.ref_name }})" \
            --notes "Versão de teste, ainda não juntada no master."
