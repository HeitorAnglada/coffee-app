name: Android CI

on:
  push:
    branches: [ "**" ]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Testes e APK de debug
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: coffee-app-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      # A cada push no master, publica uma versão em Releases com o arquivo Bloombrew.apk.
      # O link do README (releases/latest/download/Bloombrew.apk) sempre aponta para a mais nova.
      - name: Publicar versão para download
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Bloombrew.apk
          gh release create "build-${{ github.run_number }}" Bloombrew.apk \
            --target "${{ github.sha }}" \
            --title "Bloombrew · versão ${{ github.run_number }}" \
            --notes "Baixe o arquivo Bloombrew.apk abaixo e abra no celular Android (8.0 ou mais novo)." \
            --latest
